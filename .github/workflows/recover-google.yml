name: Restaurer et verifier Miam Maman v7
on:
  push:
    branches: [codex/recover-v7-20261104]
    paths: [.github/workflows/recover-google.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: miam-v7-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurer le client Google sauvegarde
        run: node scripts/recover-v7.mjs
      - name: Verifier les regles de stock
        run: npm test
      - name: Construire un apercu de test isole
        run: npm run build
      - name: Installer le navigateur de test distant
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Tester mobile et bureau sans toucher au stock familial
        run: node scripts/ui-smoke.mjs
      - name: Construire la version partagee
        env:
          MIAM_REQUIRE_SHARED_BACKEND: '1'
          MIAM_GOOGLE_WEBAPP_URL: ${{ vars.MIAM_GOOGLE_WEBAPP_URL }}
        run: npm run build
      - name: Conserver la version verifiee
        run: |
          git config user.name "Miam Maman recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src dist google-apps-script tests scripts README.md
          git diff --cached --quiet || git commit -m "Restore family v7 interface, guides and tested stock workflows"
          git push
      - name: Publier seulement apres reussite de tous les controles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "52c1e56bfa1f46f231654aa9243f814069bb20f4"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main

