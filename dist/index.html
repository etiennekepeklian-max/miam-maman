.beginner-help{margin-top:12px;min-height:52px;font-size:16px}.help-intro{font-size:18px;line-height:1.7;max-width:800px}.help-guide h2{font-size:27px}.help-guide li{font-size:18px;line-height:1.75;margin-bottom:10px}.help-guide .secondary{font-size:17px;min-height:56px}.help-guide .small{font-size:15px;line-height:1.6}.help-demo{max-width:360px}.bottom-nav button{min-height:52px}.bottom-nav{padding-bottom:max(10px,env(safe-area-inset-bottom))}@media(max-width:620px){.bottom-nav button{font-size:11px}.help-guide li{font-size:17px}.help-intro{font-size:17px}}

.vegetable-add{margin:12px 0 0 10px;background:var(--green)}.food-filter{margin:18px 0 10px;max-width:400px}.history-row .delta{overflow-wrap:anywhere;min-width:60px;font-size:16px}@media(max-width:620px){.vegetable-add{margin:12px 0 0;width:100%}.food-filter{max-width:none}}

.emoji-picker{max-height:210px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:9px;padding:4px 4px 10px}.emoji-option{min-height:44px}.voice-status{padding:13px 15px;border:1px solid #b7c9a9;background:#eef2e7;border-radius:12px;font-size:15px;line-height:1.6;white-space:pre-wrap}.voice-panel textarea{font-size:16px}.voice-panel .field{margin-top:14px}

  async function act(action,payload,message,{keep=false,formError=null}={}){

    const requestId=mutationPending.id;
    const buttons=Array.from(document.querySelectorAll('dialog button, [data-take], #toastUndo'));buttons.forEach(b=>b.disabled=true);
    try{const r=await rpc(action,{payload,id:requestId});state=r.state;lastSync=new Date();mutationPending=null;if(!keep)close();render();toast(message+(r.pending?' Conservé sur ce téléphone, envoi en attente.':''),action==='meal.take'?r.eventId:null);if(action==='meal.add')celebrate(animationPrefs.added,payload.kind==='meat'?'La viande est bien rangée !':payload.kind==='vegetable'?'Les légumes sont bien rangés !':'Un bon petit plat en réserve !');if(action==='meal.take'){const raw=(state.meals.find(m=>m.id===payload.id)?.kind||'dish')!=='dish';celebrate(raw?'hello':animationPrefs.taken,raw?'Bonne cuisine, '+profile+' !':'Bon appétit, '+profile+' !');}return true;}
    catch(e){if(formError&&$(formError))error($(formError),e.message+' Vous pouvez réessayer.');else toast(e.message);return false;}

  function dictate(callback,btn){
    if(recorder){try{recorder.stop();}catch{}return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const keyboardHelp='Touchez un champ puis le micro du clavier de votre téléphone pour dicter, ou écrivez votre phrase dans le champ prévu et touchez Remplir les champs.';
    const policy=document.permissionsPolicy||document.featurePolicy;
    if(!SR){voiceStatus('Le micro intégré n’est pas proposé par ce navigateur. '+keyboardHelp);return;}
    if(policy&&typeof policy.allowsFeature==='function'&&!policy.allowsFeature('microphone')){voiceStatus('Cette page Google bloque le micro intégré. Ouvrez l’application à l’adresse etiennekepeklian-max.github.io/miam-maman/ pour utiliser le bouton Dicter, ou utilisez le micro du clavier. '+keyboardHelp);return;}
    const old=btn.innerHTML;let rec,heard='',applied=false,failed=false,timer;
    const finish=()=>{clearTimeout(timer);btn.innerHTML=old;btn.removeAttribute('aria-busy');if(recorder===rec)recorder=null;};
    const apply=()=>{if(heard&&!applied&&modal.open){applied=true;callback(heard);}};
    try{rec=new SR();recorder=rec;rec.lang='fr-FR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=3;
      btn.innerHTML=icon('mic')+' Arrêter l’écoute';btn.setAttribute('aria-busy','true');
      voiceStatus('Ouverture du micro… Si le navigateur le demande, autorisez le microphone.');
      rec.onstart=()=>{voiceStatus('J’écoute. Parlez distinctement en français. La phrase s’affichera pendant que vous parlez.');};
      rec.onresult=e=>{heard=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();if(!modal.open)return;if($('#transcript'))$('#transcript').textContent='J’ai entendu : « '+heard+' »';if($('#voiceText')&&btn.id==='dictateMeal')$('#voiceText').value=heard;if(Array.from(e.results).every(r=>r.isFinal)){apply();try{rec.stop();}catch{}}};
      rec.onerror=e=>{failed=true;voiceStatus((({'not-allowed':'L’accès au micro a été refusé. Autorisez-le dans les réglages du site si vous le souhaitez.','service-not-allowed':'Le service de reconnaissance est bloqué ici.','audio-capture':'Aucun microphone utilisable n’a été trouvé.','no-speech':'Aucune parole n’a été entendue. Réessayez après avoir rapproché le téléphone.','network':'La reconnaissance en ligne n’a pas répondu. Vérifiez la connexion Internet.','language-not-supported':'Le service ne propose pas la reconnaissance en français.','aborted':'L’écoute a été arrêtée.'})[e.error]||'La reconnaissance vocale n’a pas abouti.')+' '+keyboardHelp);finish();};
      rec.onend=()=>{if(!failed){apply();if(!heard)voiceStatus('L’écoute est terminée sans texte reconnu. '+keyboardHelp);}finish();};
      timer=setTimeout(()=>{if(!heard)voiceStatus('Aucun texte reçu après 15 secondes. '+keyboardHelp);try{rec.stop();}catch{}finish();},15000);
      rec.start();
    }catch{finish();voiceStatus('Le micro intégré n’a pas pu démarrer. '+keyboardHelp);}
  }

PFEuuAEIL+TLFFt+M1AeJ0IJK0yyRHbPZUMeNs848+4y00kw7PXdEBiv8N+CB+zau4IUbfjjiiSu+eMKEM/445JFLPjnluzleOeaZa7455517/jnooYs+Oumlm3466qmrvjrrrbv+Ouyxyz477bXbfjvuueu+O++9+/478MELPzzxxRt/PPLJK7888807/zz00Us/PfXVW3899tlrvz333Xv/Pfjhiz8++eWbfz766au/Pvvtu/8+/PHLPz8K/fXbfz/++ScVEAA7',steps:['En bas de l’écran, touchez « Mes plats ». Trouvez le plat que vous voulez manger. Vous pouvez faire glisser l’écran pour voir la suite ou écrire son nom dans la recherche. L’emplacement écrit sur sa fiche vous dit où le chercher. Sur cette fiche, touchez « Je me sers ».','Une petite fenêtre « À table ! » s’ouvre. Le nombre au milieu indique les portions que vous allez prendre. Au départ, il vaut 1. Touchez + pour en prendre davantage, ou − pour en prendre moins. Par exemple, pour un repas à deux, choisissez 2.','Touchez « Confirmer et me régaler » et attendez la confirmation avant de recommencer.','La cocotte vous souhaite bon appétit et le stock diminue. Une erreur ? Dans Historique, touchez « Annuler » sur la prise concernée, pendant 24 heures.']}

    app.innerHTML='<p class="eyebrow">UN PETIT COUP DE MAIN</p><h1>À l’aide, la cocotte !</h1><p class="muted">MLK, GK et EK peuvent tous cuisiner et se servir. Pour commencer, choisissez vos initiales. Un bouton se touche une fois avec le doigt. Pour descendre dans la page, faites glisser votre doigt du bas vers le haut.</p><p class="help-intro">Choisissez ci-dessous ce que vous voulez faire. Lisez les étapes dans l’ordre : 1, 2, 3, 4. Pour voir les gestes, touchez « Lire le GIF » sous l’image. Chaque étape dure environ 4 secondes et l’animation recommence. « Arrêter le GIF » remet la première image.</p><div class="help-guides">'+guides.map(g=>'<section class="panel help-guide"><h2>'+g.title+'</h2><p class="small muted">Exemple illustré avec des lasagnes et un emplacement fictif. Aucun essai n’est ajouté à votre stock.</p><img class="help-demo" id="help-'+g.id+'" src="'+g.poster+'" alt="Guide illustré : '+g.title+'. Les quatre étapes sont détaillées ci-dessous."><button class="secondary wide" data-play-guide="'+g.id+'" aria-pressed="false">Lire le GIF : '+g.title.toLowerCase()+'</button><ol>'+g.steps.map(step=>'<li>'+esc(step)+'</li>').join('')+'</ol></section>').join('')+'</div><section class="panel"><h2>Ajouter et prendre des légumes non cuisinés</h2><p>Dans Mes plats, touchez « Ajouter des légumes ». Écrivez le nom, puis choisissez comment les compter : en pièces, en grammes ou en kilos. Indiquez la quantité, la date de rangement et votre emplacement. Fixez le stock d’alerte dans la même unité, puis touchez « Mettre au stock ».</p><p>Pour en utiliser, retrouvez leur fiche avec « Légumes non cuisinés » dans la liste de filtrage. Touchez « Je me sers », saisissez la quantité réellement prise dans l’unité affichée, puis « Confirmer la quantité prise ». L’application souhaite bonne cuisine. Une erreur se corrige dans Historique avec « Annuler ».</p><h2>Viande, lardons et jambon</h2><p>Dans Mes plats, touchez « Ajouter de la viande ». Choisissez pièces, paquets, grammes ou kilos. La quantité prise et le stock d’alerte utilisent toujours la même unité.</p><h2>Les autres petits repères</h2><p><strong>Connexion Google de secours :</strong> si votre navigateur bloque la connexion au stock dans l’application installable, <a href="https://script.google.com/macros/s/AKfycbyb6X17lXJRCDwbKCB9_PdCgKzXmCPH599IJnIgqSNq_bTGY7gyg3OTsM5G9RCrXjVk/exec" target="_blank" rel="noopener">ouvrez directement le stock Google</a>. Sur cette page de secours, utilisez le micro du clavier de votre téléphone pour dicter.</p><p><strong>Emplacements :</strong> dans La maison, touchez « Ajouter un emplacement ». Choisissez « Rez-de-chaussée », « Sous-sol » ou votre propre niveau, puis écrivez le nom du rangement. Aucun emplacement n’est créé pour vous. « Modifier » permet de changer le nom ou le niveau. « Supprimer » fonctionne lorsque le rangement est vide. Les anciens rangements restent sous « Niveau à préciser » jusqu’à ce que vous les classiez.</p><p><strong>Modifier une fiche :</strong> sur la fiche, touchez ⋯. Vous pouvez corriger le nom, choisir parmi 25 illustrations, changer la date, l’emplacement, le repère, le seuil, le nombre de personnes ou les commentaires. La quantité sert à corriger le stock actuel. Si quelqu’un a pris une portion entre-temps, rouvrez la fiche avant de corriger sa quantité.</p><p><strong>Vous avez refait la cuisine :</strong> touchez « + Ajouter du stock » sur la fiche. Le nom et les informations sont repris. Écrivez uniquement la nouvelle quantité et vérifiez sa date. Un nouveau lot est créé : l’ancien stock garde sa date et apparaît en premier. Vous pouvez faire cet ajout avant que l’ancien lot soit vide.</p><p><strong>Stock d’alerte :</strong> chaque plat a son seuil. Bientôt fini affiche les plats encore disponibles dont le stock atteint ce seuil ou passe en dessous ; Terminés affiche ceux à zéro.</p><p><strong>Dictée :</strong> touchez Dicter, autorisez le micro si demandé et attendez J’écoute. La phrase reconnue reste visible. Si le navigateur bloque ce micro, touchez Votre phrase dictée ou écrite, utilisez le micro du clavier de votre téléphone, puis Remplir les champs avec cette phrase. Vérifiez avant d’enregistrer.</p><p><strong>Animations :</strong> dans La maison, essayez les cinq cocottes et choisissez celles de cet appareil pour l’ouverture, l’ajout et la prise.</p><p><strong>Vos idées :</strong> chacun peut proposer une amélioration. EK voit le texte complet dans une fenêtre lorsque l’application est ouverte.</p><h2>Utiliser l’appli à la cave, sans Internet</h2><ol><li>Avant de descendre, ouvrez cette application avec Internet, choisissez votre profil et attendez « Stock partagé à jour ». Cette première ouverture est nécessaire sur chaque téléphone.</li><li>À la cave, ajoutez ou prenez vos aliments normalement. « Mode hors connexion » et le nombre d’envois en attente vous indiquent que vos actions restent conservées sur ce téléphone, même si vous fermez l’appli.</li><li>De retour avec Internet, ouvrez l’appli et laissez-la ouverte jusqu’à « Stock partagé à jour ». Les actions partent automatiquement et le Google Sheet est mis à jour. L’application fermée peut attendre la prochaine ouverture pour synchroniser.</li><li>Si « Une action doit être vérifiée » apparaît, touchez « Voir les envois en attente ». Quelqu’un a peut-être pris le même stock. Lisez le message : le stock ne devient jamais négatif. Une action refusée peut être retirée de cette liste puis saisie à nouveau avec la bonne quantité.</li></ol><p>Le stock affiché sans Internet est le dernier connu de ce téléphone. Ne supprimez pas les données du navigateur et ne désinstallez pas l’appli tant que des envois sont en attente. La dictée vocale peut nécessiter Internet : le clavier reste utilisable. La page Google de secours nécessite Internet.</p></section>';
    document.querySelectorAll('[data-play-guide]').forEach(button=>button.onclick=()=>{
      const guide=guides.find(g=>g.id===button.dataset.playGuide),playing=button.getAttribute('aria-pressed')==='true';
      $('#help-'+guide.id).src=playing?guide.poster:guide.gif;
      button.setAttribute('aria-pressed',String(!playing));button.textContent=playing?'Lire le GIF : '+guide.title.toLowerCase():'Arrêter le GIF';
    });
  }
  function exportStock(){
    const protect=x=>{let v=String(x??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
    const rows=[['Article','Quantité','Emplacement','Repère','Date','Seuil d’alerte','Type','Unité','Nombre de personnes','Commentaires','Niveau'],...state.meals.map(m=>[m.name,m.quantity,m.locationName,m.detail,m.preparedAt,m.threshold,m.kind==='vegetable'?'Légumes non cuisinés':m.kind==='meat'?'Viande':'Plat préparé',MiamCore.unit(m),m.people||'',m.comments||'',m.locationLevel||''])];
    const blob=new Blob(['\ufeff'+rows.map(r=>r.map(protect).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Miam-Maman-stock-'+localDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  $('#modeBanner').hidden=live;
  window.addEventListener('offline',()=>paintSync());window.addEventListener('online',()=>refresh(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});
  setInterval(()=>{if(!document.hidden)refresh(true);},30000);
  render();
  celebrate(animationPrefs.opening,'Bienvenue dans la cuisine !');
  try{const remembered=localStorage.getItem('miam-profile-v2');if(MiamCore.profiles.some(p=>p.id===remembered))login(remembered);}catch{}
})();
</script>
