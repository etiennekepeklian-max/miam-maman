  <script>/* Shared domain rules: browser preview and Google Apps Script. */
var MiamCore = (function () {
  'use strict';
  var PROFILES = [{id:'MLK',role:'maison',label:'MLK'},{id:'GK',role:'maison',label:'GK'},{id:'EK',role:'maison',label:'EK'}];
  function profile(id) { var found=PROFILES.find(function(p){return p.id===id;}); if(!found) fail('Choisissez MLK, GK ou EK.'); return Object.assign({},found); }
  function isLow(meal) { return meal.quantity>0 && meal.quantity<=meal.threshold; }
  function empty() { return {locations: [], meals: [], events: [], suggestions: []}; }
  function fail(message) { throw new Error(message); }
  function text(value, max) {
    if (typeof value !== 'string' || !value.trim() || value.trim().length > max) fail('Merci de compléter les champs avec un texte valide.');

  async function refresh(silent=false){
    if(!role||refreshing||busy||modal.open)return;refreshing=true;
    try{const r=await rpc('state');state=r.state;lastSync=new Date();if(!modal.open&&!['help','suggestions'].includes(page))render();if(!silent)toast('Le stock est à jour.');}
    catch(e){if(!silent)toast(e.message);}
    finally{refreshing=false;checkSuggestions();}

  async function act(action,payload,message,{keep=false,formError=null}={}){
    if(busy)return;busy=true;
    // Keep the same ID after a transport error. A retry cannot consume twice.
    const signature=JSON.stringify({action,payload});
    if(!mutationPending||mutationPending.signature!==signature)mutationPending={signature,id:id()};
    const requestId=mutationPending.id;
    const buttons=Array.from(document.querySelectorAll('dialog button, [data-take], #toastUndo'));buttons.forEach(b=>b.disabled=true);
    try{const r=await rpc(action,{payload,id:requestId});state=r.state;lastSync=new Date();mutationPending=null;if(!keep)close();render();toast(message,action==='meal.take'?r.eventId:null);if(action==='meal.add')celebrate(animationPrefs.added,'Un bon petit plat en réserve !');if(action==='meal.take')celebrate(animationPrefs.taken,'Bon appétit, '+profile+' !');return true;}
    catch(e){if(formError&&$(formError))error($(formError),e.message+' Vous pouvez réessayer.');else toast(e.message);return false;}
    finally{busy=false;buttons.forEach(b=>{if(b.isConnected)b.disabled=false;});checkSuggestions();}
  }

  function dictate(callback,btn){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Utilisez le micro du clavier de votre téléphone pour dicter dans le champ.');return;}
    if(recorder){try{recorder.stop();}catch{}return;}
    const old=btn.innerHTML;recorder=new SR();const rec=recorder;rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;
    btn.innerHTML=icon('mic')+' J’écoute…';btn.setAttribute('aria-busy','true');
    rec.onresult=e=>{if(modal.open)callback(e.results[0][0].transcript);};
    rec.onerror=e=>toast(({ 'not-allowed':'Le micro est refusé. Autorisez-le dans le navigateur, ou utilisez la saisie écrite.', 'no-speech':'Je n’ai rien entendu. Vous pouvez réessayer.', 'network':'La dictée ne répond pas. Utilisez le micro du clavier ou la saisie écrite.'})[e.error]||'La dictée n’est pas disponible ici. Utilisez le micro du clavier ou la saisie écrite.');
    rec.onend=()=>{btn.innerHTML=old;btn.removeAttribute('aria-busy');recorder=null;};
    try{rec.start();}catch{recorder=null;btn.innerHTML=old;btn.removeAttribute('aria-busy');toast('La dictée n’a pas démarré. Utilisez le micro du clavier ou la saisie écrite.');}
  }

  function checkSuggestions(){

    unread.forEach(item=>noticedSuggestions.add(item.id));
    dialog(unread.length===1?'Une nouvelle idée pour l’appli !':'De nouvelles idées pour l’appli !',unread.map(suggestionCard).join('')+'<button class="primary wide" id="dismissSuggestions">J’ai lu, merci !</button>');

PFEuuAEIL+TLFFt+M1AeJ0IJK0yyRHbPZUMeNs848+4y00kw7PXdEBiv8N+CB+zau4IUbfjjiiSu+eMKEM/445JFLPjnluzleOeaZa7455517/jnooYs+Oumlm3466qmrvjrrrbv+Ouyxyz477bXbfjvuueu+O++9+/478MELPzzxxRt/PPLJK7888807/zz00Us/PfXVW3899tlrvz333Xv/Pfjhiz8++eWbfz766au/Pvvtu/8+/PHLPz8K/fXbfz/++ScVEAA7',steps:['En bas de l’écran, touchez « Mes plats ». Trouvez le plat que vous voulez manger. Vous pouvez faire glisser l’écran pour voir la suite ou écrire son nom dans la recherche. L’emplacement écrit sur sa fiche vous dit où le chercher. Sur cette fiche, touchez « Je me sers ».','Une petite fenêtre « À table ! » s’ouvre. Le nombre au milieu indique les portions que vous allez prendre. Au départ, il vaut 1. Touchez + pour en prendre davantage, ou − pour en prendre moins. Par exemple, pour un repas à deux, choisissez 2.','Touchez « Confirmer et me régaler » et attendez la confirmation avant de recommencer.','La cocotte vous souhaite bon appétit et le stock diminue. Une erreur ? Dans Historique, touchez « Annuler » sur la prise concernée, pendant 24 heures.']}
    ];
    app.innerHTML='<p class="eyebrow">UN PETIT COUP DE MAIN</p><h1>À l’aide, la cocotte !</h1><p class="muted">MLK, GK et EK peuvent tous cuisiner et se servir. Pour commencer, choisissez vos initiales. Un bouton se touche une fois avec le doigt. Pour descendre dans la page, faites glisser votre doigt du bas vers le haut.</p><p class="help-intro">Choisissez ci-dessous ce que vous voulez faire. Lisez les étapes dans l’ordre : 1, 2, 3, 4. Pour voir les gestes, touchez « Lire le GIF » sous l’image. Chaque étape dure environ 4 secondes et l’animation recommence. « Arrêter le GIF » remet la première image.</p><div class="help-guides">'+guides.map(g=>'<section class="panel help-guide"><h2>'+g.title+'</h2><p class="small muted">Exemple illustré avec des lasagnes et un emplacement fictif. Aucun essai n’est ajouté à votre stock.</p><img class="help-demo" id="help-'+g.id+'" src="'+g.poster+'" alt="Guide illustré : '+g.title+'. Les quatre étapes sont détaillées ci-dessous."><button class="secondary wide" data-play-guide="'+g.id+'" aria-pressed="false">Lire le GIF : '+g.title.toLowerCase()+'</button><ol>'+g.steps.map(step=>'<li>'+esc(step)+'</li>').join('')+'</ol></section>').join('')+'</div><section class="panel"><h2>Les autres petits repères</h2><p><strong>Emplacements :</strong> dans La maison, créez vos propres noms. Un emplacement peut être supprimé lorsqu’il ne contient plus de portions. Déplacez les plats encore présents depuis le bouton ⋯ de leur fiche.</p><p><strong>Modifier une fiche :</strong> le bouton ⋯ permet de changer l’emplacement, le repère ou le stock d’alerte.</p><p><strong>Stock d’alerte :</strong> chaque plat a son seuil. Bientôt fini affiche les plats encore disponibles dont le stock atteint ce seuil ou passe en dessous ; Terminés affiche ceux à zéro.</p><p><strong>Dictée :</strong> si le micro du formulaire ne fonctionne pas, placez le curseur dans le champ et utilisez le micro du clavier de votre téléphone, ou écrivez simplement.</p><p><strong>Animations :</strong> dans La maison, essayez les cinq cocottes et choisissez celles de cet appareil pour l’ouverture, l’ajout et la prise.</p><p><strong>Vos idées :</strong> chacun peut proposer une amélioration. EK voit le texte complet dans une fenêtre lorsque l’application est ouverte.</p><p><strong>Connexion :</strong> Internet est nécessaire pour le stock commun. Après une erreur réseau, réessayez la même action sans changer les quantités ; l’application évite les doublons.</p></section>';
    document.querySelectorAll('[data-play-guide]').forEach(button=>button.onclick=()=>{
      const guide=guides.find(g=>g.id===button.dataset.playGuide),playing=button.getAttribute('aria-pressed')==='true';
      $('#help-'+guide.id).src=playing?guide.poster:guide.gif;
      button.setAttribute('aria-pressed',String(!playing));button.textContent=playing?'Lire le GIF : '+guide.title.toLowerCase():'Arrêter le GIF';
    });
  }
  function exportStock(){
    const protect=x=>{let v=String(x??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
    const rows=[['Plat','Portions','Emplacement','Repère','Préparé le','Seuil d’alerte'],...state.meals.map(m=>[m.name,m.quantity,m.locationName,m.detail,m.preparedAt,m.threshold])];
    const blob=new Blob(['\ufeff'+rows.map(r=>r.map(protect).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Miam-Maman-stock-'+localDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  $('#modeBanner').hidden=live;
  window.addEventListener('online',()=>refresh(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});
  setInterval(()=>{if(!document.hidden)refresh(true);},30000);
  render();
  celebrate(animationPrefs.opening,'Bienvenue dans la cuisine !');
  try{const remembered=localStorage.getItem('miam-profile-v2');if(MiamCore.profiles.some(p=>p.id===remembered))login(remembered);}catch{}
})();
</script>
